<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ahhihiihihi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: #ff2d8a;
        left: -15vmax;
        top: -10vmax;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: #8a3dff;
        right: -12vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.9rem, 8.5vw, 4rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.6rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 30px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s;
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose);
        will-change: transform;
        transition: opacity 1s;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn,
      .b2 {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: transform 0.2s;
        z-index: 5;
      }
      #btn:hover,
      .b2:hover {
        transform: scale(1.07);
      }
      .b2.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border: 1px solid rgba(255, 182, 213, 0.5);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 182, 213, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.35),
          inset 0 0 40px rgba(255, 150, 200, 0.08);
        transform: scale(0.85) translateY(30px);
        transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.2s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.88rem;
        line-height: 1.7;
        min-height: 6.4em;
        margin: 0 0.3rem;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.55rem 0.45rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.1rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 1s;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      * {
        cursor: none !important;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 26px;
        color: #ff3d84;
        text-shadow:
          0 0 12px #ff3d84,
          0 0 28px #ff6fae;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.1s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }
      #name-modal {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        z-index: 1000;
        background: rgba(20, 4, 18, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 0.6s, visibility 0.6s;
      }
      #name-modal.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #name-modal, #name-modal * {
        cursor: auto !important;
      }
      .modal-box {
        position: relative;
        max-width: 410px;
        width: 100%;
        text-align: center;
        padding: 2rem 1.5rem 1.6rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.05)
        );
        border: 1px solid rgba(255, 182, 213, 0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.45),
          inset 0 0 40px rgba(255, 150, 200, 0.12);
        animation: modalPop 0.5s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      @keyframes modalPop {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .modal-icon {
        font-size: 2.2rem;
        margin-bottom: 0.3rem;
        animation: beat 1.4s infinite;
      }
      .modal-title {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        margin: 0 0 0.5rem;
        text-shadow: 0 0 16px var(--rose);
      }
      .modal-desc {
        font-size: 0.88rem;
        color: #ffc2dc;
        margin-bottom: 1.3rem;
        line-height: 1.5;
        font-weight: 300;
      }
      .modal-inp {
        width: 100%;
        padding: 0.85rem 1.2rem;
        border-radius: 99px;
        border: 1.5px solid rgba(255, 182, 213, 0.6);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font: 600 1.1rem var(--sans);
        text-align: center;
        outline: none;
        box-sizing: border-box;
        margin-bottom: 1.2rem;
        box-shadow: 0 0 20px rgba(255, 61, 132, 0.2);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .modal-inp:focus {
        border-color: #ff6fae;
        box-shadow: 0 0 25px rgba(255, 111, 174, 0.6);
      }
      .modal-inp::placeholder {
        color: rgba(255, 255, 255, 0.45);
        font-weight: 400;
      }
      .modal-btn {
        width: 100%;
        padding: 0.85rem 1.8rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer !important;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: all 0.2s;
      }
      .modal-btn:hover {
        transform: scale(1.05);
      }
      .modal-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed !important;
        pointer-events: none;
        box-shadow: none;
        transform: none !important;
      }
      .error-msg {
        color: #ff5277;
        font-size: 0.82rem;
        margin-top: -0.7rem;
        margin-bottom: 0.9rem;
        display: none;
        font-weight: 600;
      }
      .error-msg.show {
        display: block;
      }
      @keyframes shakeInp {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }
      .shake {
        animation: shakeInp 0.35s ease !important;
        border-color: #ff3366 !important;
      }
      .role-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin: 1.1rem 0 0.8rem;
      }
      .role-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 182, 213, 0.35);
        border-radius: 18px;
        padding: 0.85rem 0.6rem;
        color: #fff;
        cursor: pointer !important;
        transition: all 0.25s cubic-bezier(0.2, 1.2, 0.3, 1);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }
      .role-btn:hover {
        background: rgba(255, 61, 132, 0.32);
        transform: translateY(-3px) scale(1.02);
        border-color: #ff6fae;
        box-shadow: 0 8px 24px rgba(255, 61, 132, 0.45);
      }
      .role-crush {
        grid-column: span 2;
        background: linear-gradient(135deg, rgba(255, 61, 132, 0.35), rgba(255, 111, 174, 0.22));
        border: 1.5px solid rgba(255, 111, 174, 0.65);
        padding: 0.95rem 0.6rem;
      }
      .role-crush:hover {
        background: linear-gradient(135deg, rgba(255, 61, 132, 0.55), rgba(255, 111, 174, 0.4));
        box-shadow: 0 10px 30px rgba(255, 42, 109, 0.55);
      }
      .role-icon {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .role-svg {
        display: block;
        transition: transform 0.25s ease;
      }
      .role-btn:hover .role-svg {
        transform: scale(1.15) rotate(4deg);
      }
      .role-text {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 1.02rem;
        display: block;
        color: #ffd9a8;
        letter-spacing: 0.04em;
        text-shadow: 0 0 10px rgba(255, 217, 168, 0.3);
      }
      .role-crush .role-text {
        color: #fff;
        font-size: 1.1rem;
        text-shadow: 0 0 14px var(--rose);
      }
      .back-link {
        background: none;
        border: none;
        color: #ffd9a8;
        font-size: 0.82rem;
        cursor: pointer !important;
        text-decoration: underline;
        opacity: 0.85;
        margin-top: 0.4rem;
        transition: opacity 0.2s;
      }
      .back-link:hover {
        opacity: 1;
      }

      .emoji-motion {
        display: inline-block;
        transform-origin: center;
        animation: emojiFloat 2.4s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes emojiFloat {
        0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
        50% { transform: translateY(-5px) rotate(4deg) scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .emoji-motion { animation: none; }
      }
    </style>
  </head>
  <body>
    <audio id="bg-music" src="nhac.mp3" loop preload="auto"></audio>
    <div id="name-modal">
      <div class="modal-box">
        <!-- BƯỚC 1: NHẬP TÊN -->
        <div id="step-1">
          <div class="modal-icon">🌸</div>
          <h2 class="modal-title">Chào Người đẹp😜</h2>
          <p class="modal-desc">What is your name?</p>
          <input type="text" id="name-inp" class="modal-inp" placeholder="Enter the recipient's name..." autofocus />
          <div id="name-error" class="error-msg">Please enter your name first</div>
          <button id="step1-next-btn" class="modal-btn" disabled onclick="goToStep2()">Continue ➔</button>
        </div>

        <!-- BƯỚC 2: CHỌN MỐI QUAN HỆ VỚI CẬU CHỦ -->
        <div id="step-2" style="display: none;">
          <div class="modal-icon">💌</div>
          <h2 class="modal-title">Bạn gì của tôi?</h2>
          <p class="modal-desc">Gửi tới: <b id="preview-name" style="color:#ffd9a8"></b> 💖<br></p>
          
          <div class="role-grid">
            <button class="role-btn" type="button" onclick="selectRole('friend')">
              <span class="role-icon">
                <svg class="role-svg" viewBox="0 0 32 32" width="28" height="28">
                  <defs>
                    <linearGradient id="grad-friend" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ffb3d4"/>
                      <stop offset="100%" stop-color="#ff4b82"/>
                    </linearGradient>
                  </defs>
                  <g fill="url(#grad-friend)">
                    <circle cx="16" cy="10" r="5.5"/>
                    <circle cx="22" cy="14" r="5.5"/>
                    <circle cx="20" cy="22" r="5.5"/>
                    <circle cx="12" cy="22" r="5.5"/>
                    <circle cx="10" cy="14" r="5.5"/>
                  </g>
                  <circle cx="16" cy="16" r="4" fill="#ffd9a8"/>
                  <circle cx="16" cy="16" r="2" fill="#fff"/>
                </svg>
              </span>
              <span class="role-text">Friend</span>
            </button>

            <button class="role-btn" type="button" onclick="selectRole('best_friend')">
              <span class="role-icon">
                <svg class="role-svg" viewBox="0 0 32 32" width="28" height="28">
                  <defs>
                    <linearGradient id="grad-bf" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ffeaa7"/>
                      <stop offset="50%" stop-color="#ff9f43"/>
                      <stop offset="100%" stop-color="#ee5253"/>
                    </linearGradient>
                  </defs>
                  <path d="M8 8l3.5 7a3 3 0 0 0 2.7 1.6h.4L13 25M9 25h7" fill="none" stroke="url(#grad-bf)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M7.8 8h7.4l-1.8 5H9.6z" fill="url(#grad-bf)" fill-opacity="0.55"/>
                  <path d="M24 8l-3.5 7a3 3 0 0 1-2.7 1.6h-.4L19 25M16 25h7" fill="none" stroke="url(#grad-bf)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M24.2 8h-7.4l1.8 5h5.6z" fill="url(#grad-bf)" fill-opacity="0.55"/>
                  <circle cx="16" cy="6" r="1.5" fill="#fff"/>
                  <path d="M16 2v2M16 8v2M13 5h6" stroke="#ffd9a8" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="role-text">Best Friend</span>
            </button>

            <button class="role-btn" type="button" onclick="selectRole('sister')">
              <span class="role-icon">
                <svg class="role-svg" viewBox="0 0 32 32" width="28" height="28">
                  <defs>
                    <linearGradient id="grad-sister" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ffd9a8"/>
                      <stop offset="60%" stop-color="#ff758c"/>
                      <stop offset="100%" stop-color="#ff4b82"/>
                    </linearGradient>
                  </defs>
                  <path d="M5 22h22l-2-11-6 5.5-3-8.5-3 8.5-6-5.5z" fill="url(#grad-sister)" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linejoin="round"/>
                  <circle cx="5" cy="11" r="1.8" fill="#ffd9a8"/>
                  <circle cx="16" cy="8" r="2.2" fill="#fff"/>
                  <circle cx="27" cy="11" r="1.8" fill="#ffd9a8"/>
                  <circle cx="16" cy="18" r="1.8" fill="#fff"/>
                  <rect x="5" y="22" width="22" height="2.5" rx="1.2" fill="#ffd9a8"/>
                </svg>
              </span>
              <span class="role-text">Sister</span>
            </button>

            <button class="role-btn" type="button" onclick="selectRole('niece')">
              <span class="role-icon">
                <svg class="role-svg" viewBox="0 0 32 32" width="28" height="28">
                  <defs>
                    <linearGradient id="grad-niece" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ffeaa7"/>
                      <stop offset="50%" stop-color="#ff9ec8"/>
                      <stop offset="100%" stop-color="#ff5277"/>
                    </linearGradient>
                  </defs>
                  <rect x="7" y="14" width="18" height="12" rx="2" fill="url(#grad-niece)"/>
                  <rect x="5" y="11" width="22" height="3.5" rx="1.5" fill="#ff758c"/>
                  <rect x="14.5" y="11" width="3" height="15" fill="#ffd9a8"/>
                  <path d="M12 9c-2.5-3-5.5 0-2 2h6c3.5-2 .5-5-2-2z" fill="#ffd9a8"/>
                  <circle cx="16" cy="9.5" r="1.5" fill="#fff"/>
                </svg>
              </span>
              <span class="role-text">Niece</span>
            </button>

            <button class="role-btn role-crush" type="button" onclick="selectRole('crush')">
              <span class="role-icon">
                <svg class="role-svg" viewBox="0 0 32 32" width="30" height="30">
                  <defs>
                    <linearGradient id="grad-crush" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ff758c"/>
                      <stop offset="45%" stop-color="#ff2a6d"/>
                      <stop offset="100%" stop-color="#c2003c"/>
                    </linearGradient>
                  </defs>
                  <path d="M16 27s-10-6.2-12.8-11.8A7.2 7.2 0 0 1 14.5 7.8L16 9.4l1.5-1.6a7.2 7.2 0 0 1 11.3 7.4C26 20.8 16 27 16 27z" fill="url(#grad-crush)"/>
                  <path d="M8.5 11a4.2 4.2 0 0 1 5-1" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="24" cy="9" r="1.3" fill="#fff"/>
                  <path d="M24 6v2M24 10v2M21 9h6" stroke="#ffd9a8" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="role-text">Crush</span>
            </button>
          </div>

          <button type="button" class="back-link" onclick="backToStep1()">Editname</button>
        </div>
      </div>
    </div>

    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi tới</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
         
        </div>
      </div>
    </div>

    <script>
      // BỘ LỜI CHÚC DÀNH CHO TỪNG VAI TRÒ (Bạn có thể tự sửa nội dung sau)
      const TEMPLATES = {
        friend: {
          tag: "Friend",
          getIntro: (name) =>
            `Nhân ngày 20/10, chúc ${name} luôn tươi tắn, ngập tràn năng lượng tích cực và luôn mỉm cười thật rạng rỡ. Cảm ơn vì chúng ta là những người bạn tốt của nhau! 🌸`,
          wishes: [
            ["🦋", "Rạng rỡ", "Luôn giữ nụ cười tươi tắn trên môi."],
            ["✨", "May mắn", "Mọi dự định và công việc đều hanh thông."],
            ["💐", "Bình an", "Mỗi ngày đều nhẹ nhàng và nhiều niềm vui."],
            ["🧋", "Tri kỷ", "Mãi là người bạn tuyệt vời nhé!"],
          ],
          quote: "Tình bạn đẹp là món quà quý giá làm cuộc sống thêm phần ý nghĩa.",
          sign: "-Hảo-",
        },
        best_friend: {
          tag: "Best Friend",
          getIntro: (name) =>
            `Chúc mừng 20/10 bạn thân chí cốt ${name}! Chúc bạn luôn xinh đẹp, thành công, tiền ra như nước nhé, cảm ơn vì đã là một phần trong kí ức của mình 💖`,
          wishes: [
            ["🫶", "Xinh đẹp", "Xinh xắn, tự tin và luôn là chính mình."],
            ["💎", "Giàu có", "Tiền vào như nước, sớm ngày thành phú bà."],
            ["🍰", "Ăn ngon", "Ăn mãi không béo, luôn có đồ ăn ngon."],
            ["🎉", "Mãi thân", "Dù thế nào cũng không được quên tao đấy!"],
          ],
          quote: "Tao ghét mày lắm, nhưng tao sẽ luôn ở đây vì mày.",
          sign: "—Hảo Hảo—",
        },
        sister: {
          tag: "Sister",
          getIntro: (name) =>
            `Nhân ngày 20/10,em chúc chị ${name} của em luôn xinh đẹp, trẻ trung, ngập tràn hạnh phúc và luôn được anh rể và con gái yêu thương, chiều chuộng như một nàng công chúa! 🌷`,
          wishes: [
            ["👑", "Trẻ trung", "Sớm giảm được câu, trẻ mãi không già."],
            ["💝", "Hạnh phúc", "Luôn nhận được những điều tuyệt vời nhất."],
            ["🪷", "Thành công", "Cố gắng cày nhiều tiền mua sữa cho con."],
            ["💖", "Công chúa", "Luôn được cưng chiều và yêu thương."],
          ],
          quote: "Gia đình là nơi ấm áp nhất, và xị gái em luôn là bông hoa rực rỡ nhất.",
          sign: "— Em Hảo — 💐",
        },
        niece: {
          tag: "Niece",
          getIntro: (name) =>
            `Chúc cô cháu gái nhỏ ${name} một ngày 20/10 ngập tràn niềm vui, quà bánh và tiếng cười. Chúc cháu luôn ngoan ngoãn, học giỏi, xinh xắn và đáng yêu nhé! 🎈`,
          wishes: [
            ["🧸", "Học giỏi", "Thông minh, chăm chỉ và luôn đạt điểm cao."],
            ["🍭", "Hồn nhiên", "Luôn giữ nét ngây thơ và nụ cười rạng rỡ."],
            ["🌼", "Xinh xắn", "Càng lớn càng duyên dáng và đáng yêu."],
            ["🎁", "Nhiều quà", "Hôm nay nhận được thật nhiều quà và lời chúc!"],
          ],
          quote: "Nụ cười hồn nhiên của cháu luôn là niềm vui lớn của thằng cậu này.",
          sign: "—Cậu Hảo—",
        },
        crush: {
          tag: "Crush",
          getIntro: (name) =>
            `Gửi ${name} - Cô gái tớ thàm thương. Chúc cậu có một ngày 20/10 thật hạnh phúc, xinh đẹp và luôn nở nụ cười làm tan chảy trái tim tớ tiếp nheseee <3 🌹`,
          wishes: [
            ["💘", "Xinh đẹp nhất", "Trong mắt mình, cậu luôn là điều tuyệt vời nhất."],
            ["💞", "Được yêu thương", "Luôn được nâng niu và chở che mỗi ngày."],
            ["💫", "Ấm áp", "Mong mọi điều dịu dàng nhất sẽ đến với cậu."],
            ["💌", "Gắn kết", "Hy vọng tụi mình có cơ hội bên nhao."],
          ],
          quote: "Trái đất có 8 tỷ người, nhưng cạu là người duy nhất làm tan chảy trái tim tớ.",
          sign: "—Gửi người không tồn tại— 💌",
        },
      };

      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "",
        name: "",
        intro: "",
        wishes: [],
        quote: "",
        sign: "",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      // Gói emoji thành từng phần tử để chúng chuyển động nhẹ trên trang.
      const emojiPattern = /\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?)*|\p{Regional_Indicator}{2}/gu;
      function animateEmojis(root) {
        if (!root) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (node.parentElement?.closest('script, style, .emoji-motion')) continue;
          if (emojiPattern.test(node.nodeValue)) { nodes.push(node); emojiPattern.lastIndex = 0; }
        }
        let index = 0;
        nodes.forEach((node) => {
          const text = node.nodeValue;
          const fragment = document.createDocumentFragment();
          let last = 0;
          emojiPattern.lastIndex = 0;
          for (const match of text.matchAll(emojiPattern)) {
            if (match.index > last) fragment.append(document.createTextNode(text.slice(last, match.index)));
            const emoji = document.createElement('span');
            emoji.className = 'emoji-motion';
            emoji.style.animationDelay = ((index++ % 6) * 0.14) + 's';
            emoji.textContent = match[0];
            fragment.append(emoji);
            last = match.index + match[0].length;
          }
          if (last < text.length) fragment.append(document.createTextNode(text.slice(last)));
          node.replaceWith(fragment);
        });
      }
      animateEmojis(document.body);

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0,
        started = false,
        enteredName = "";

      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }

      // Xử lý kiểm tra ô nhập tên
      const nameInp = $("name-inp");
      const nextBtn = $("step1-next-btn");
      const nameError = $("name-error");

      nameInp.addEventListener("input", () => {
        const hasVal = nameInp.value.trim().length > 0;
        nextBtn.disabled = !hasVal;
        if (hasVal) {
          nameInp.classList.remove("shake");
          nameError.classList.remove("show");
        }
      });

      function goToStep2() {
        const val = nameInp.value.trim();
        if (!val) {
          nameInp.classList.remove("shake");
          void nameInp.offsetWidth;
          nameInp.classList.add("shake");
          nameError.classList.add("show");
          nextBtn.disabled = true;
          return;
        }
        enteredName = val;
        $("preview-name").textContent = enteredName;
        $("step-1").style.display = "none";
        $("step-2").style.display = "block";
      }

      function backToStep1() {
        $("step-2").style.display = "none";
        $("step-1").style.display = "block";
        nameInp.focus();
      }

      nameInp.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          goToStep2();
        }
      });

      
function selectRole(roleKey) {
  if (started) return;
  started = true;

  // Phát nhạc ngay khi chọn vai trò
  const music = document.getElementById("bg-music");
  music.volume = 0.6; // Âm lượng 60%
  music.play().catch(err => {
    console.log("Không thể phát nhạc:", err);
  });

  const template = TEMPLATES[roleKey] || TEMPLATES.friend;


        CFG.name = enteredName;
        CFG.l2 = enteredName.toUpperCase();
        CFG.intro = template.getIntro(enteredName);
        CFG.wishes = template.wishes;
        CFG.quote = template.quote;
        CFG.sign = template.sign;
        document.title = `Gửi ${enteredName} 💖`;

        $("name").textContent = CFG.name;
        $("quote").textContent = CFG.quote;
        $("sign").textContent = CFG.sign;
        $("wishes").innerHTML = CFG.wishes
          .map(
            (w) =>
              `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
          )
          .join("");
        animateEmojis($("wishes"));

        build($("l1"), CFG.l1, "l1");
        build($("l2"), CFG.l2, "l2");
        total = flyers.length;

        $("name-modal").classList.add("hide");

        (document.fonts && document.fonts.ready
          ? document.fonts.ready
          : Promise.resolve()
        ).then(init);
      }

      function init() {
        // chữ thật
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        // chữ gây nhiễu bay lung tung
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffd9a8",
          "#e0b3ff",
          "#fff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (!started) return;
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });

      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++)
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
      }
      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) setTimeout(type, 40);
          else {
            animateEmojis($("msg"));
            document
              .querySelectorAll(".w")
              .forEach((w, k) =>
                setTimeout(() => w.classList.add("on"), k * 350),
              );
            setTimeout(() => $("quote").classList.add("on2"), 1700);
            setTimeout(() => $("sign").classList.add("on2"), 2500);
            setTimeout(() => ($("btns").style.opacity = 1), 3000);
          }
        }, 1200);
      }
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          if (!started) return;
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm();
        }
      });
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 50) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "💗", "💕"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1100);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          for (let i = 0; i < 6; i++)
            burst(e.clientX, e.clientY, rnd(HEARTS), 18);
        }
      });
    </script>
